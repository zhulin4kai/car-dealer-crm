server:
  port: 8089
  servlet:
    context-path: /

# 配置数据库连接相关信息
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/car_dealer_crm}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 最大连接数，默认是 10
      maximum-pool-size: 30
      # 最小空闲连接，默认是 10
      minimum-idle: 5
      # 等待连接池分配连接的最大时长，超过该时长还没有可用连接则发生超时异常（单位毫秒）
      connection-timeout: 5000
      # 空闲连接的最大时长，空闲多久就被释放回收，设置为 0 不让连接回收
      idle-timeout: 600000
      # 一个连接的最大生命时间，超过该时间还没有使用就回收掉（单位毫秒），最好不要超过 8 小时
      max-lifetime: 18000000


  # 配置 redis 的连接信息
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0

  # 设置 jackson 返回 json 数据时，时区和格式
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    deserialization:
      ADJUST_DATES_TO_CONTEXT_TIME_ZONE: false
    modules:
      - com.fasterxml.jackson.datatype.jsr310.JavaTimeModule

# 指定一下 mapper.xml 文件的位置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 在控制台打印 sql 语句（仅 dev profile 生效，生产环境请禁用）
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

ai:
  provider:
    key-encryption-secret: ${AI_PROVIDER_KEY_ENCRYPTION_SECRET:}
    local-key-file: ${AI_PROVIDER_KEY_ENCRYPTION_SECRET_FILE:${user.home}/.car-dealer-crm/ai-provider-key.secret}
  dealer-ai:
    environment: ${DEALER_AI_ENV:${APP_ENV:local}}
    base-url: ${DEALER_AI_BASE_URL:http://localhost:8091}
    internal-token: ${DEALER_AI_INTERNAL_TOKEN:dev-internal-token}
    tool-token: ${DEALER_AI_TOOL_TOKEN:${DEALER_AI_INTERNAL_TOKEN:dev-internal-token}}
