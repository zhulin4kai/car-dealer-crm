spring:
  datasource:
    driver-class-name: org.h2.Driver
    # 每个 Spring 测试上下文使用独立数据库；同一上下文内仍可复用连接和事务。
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;
    username: sa
    password: 
    
  h2:
    console:
      enabled: true
  
  sql:
    init:
      data-locations: classpath:data.sql
      schema-locations: classpath:schema-test.sql
      mode: always
  
# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.autodealer.crm.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    
# PageHelper 分页配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# 日志配置
logging:
  level:
    com.autodealer.crm: debug
    org.springframework: info 

ai:
  provider:
    key-encryption-secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

security:
  credential-delivery:
    derivation-key: test-only-credential-derivation-key-00000001
  user-management-bootstrap-gate:
    enabled: false
  session:
    legacy-accept-until: 2099-01-01T00:00:00Z
