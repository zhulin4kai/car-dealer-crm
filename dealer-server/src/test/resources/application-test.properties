# 测试环境配置
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Redis测试配置
spring.data.redis.client-type=lettuce
spring.data.redis.host=localhost
spring.data.redis.port=56379
spring.data.redis.connect-timeout=1ms
spring.data.redis.client.connect-timeout=1ms
spring.data.redis.lettuce.connect-timeout=1ms
spring.data.redis.lettuce.shutdown-timeout=1ms

# 禁用SQL初始化
spring.sql.init.mode=never
spring.sql.init.platform=h2

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.bjpowernode.model
mybatis.configuration.map-underscore-to-camel-case=true

# 日志级别
logging.level.com.bjpowernode.mapper=debug 