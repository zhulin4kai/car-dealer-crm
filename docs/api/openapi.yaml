      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 仅支持 .xlsx，默认最大 5MB。
      responses:
        "200":
          description: 导入成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: 文件可解析但存在行级导入错误，data 返回 ImportResult；合法行可能已经导入成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ImportResult"
