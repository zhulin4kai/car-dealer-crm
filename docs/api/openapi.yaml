    UpdateInvoiceStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ISSUED, FAILED, VOIDED]
        reason:
          type: string
          description: 状态为 FAILED 或 VOIDED 时必填。
    RedReverseInvoiceRequest:
      type: object
      required: [amount, reason]
      properties:
        amount:
          type: number
          minimum: 0.01
          description: 正数红冲金额，服务端保存为负数红字发票。
        reason:
          type: string
    ReissueInvoiceRequest:
      type: object
      required: [amount, reason]
      properties:
        type:
          type: string
        title:
          type: string
        taxNumber:
          type: string
        bankName:
          type: string
        bankAccount:
          type: string
        address:
          type: string
        phone:
          type: string
        amount:
          type: number
          minimum: 0.01
        reason:
          type: string
    PaymentMethod:
      type: string
      enum:
        - CASH
        - BANK_TRANSFER
        - WECHAT
        - ALIPAY
        - CHECK
        - OTHER
    PaymentType:
      type: string
      enum:
        - DEPOSIT
        - INSTALLMENT
        - FULL
        - BALANCE
        - REFUND
    PaymentStatus:
      type: string
      enum:
        - PENDING
        - COMPLETED
        - FAILED
        - REVERSED
        - VOIDED
    TransactionPayment:
      type: object
      properties:
        id:
          type: integer
        tranId:
          type: integer
        paymentNo:
          type: string
        amount:
          type: number
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        paymentType:
          $ref: "#/components/schemas/PaymentType"
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        paymentTime:
          type: string
          format: date-time
        transactionRef:
          type: string
        idempotencyKey:
          type: string
        remark:
          type: string
        createTime:
          type: string
          format: date-time
    CreatePaymentRequest:
      type: object
      required: [tranId, paymentMethod]
      properties:
        tranId:
          type: integer
        amount:
          type: number
          description: 兼容旧客户端字段，服务端不信任此值，按剩余应收计算本次登记金额。
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        paymentType:
          $ref: "#/components/schemas/PaymentType"
          description: 兼容旧客户端字段，服务端按资金事实派生收款类型。
        transactionRef:
          type: string
          description: 外部支付参考号；银行转账、微信、支付宝和支票必填，用于幂等识别。
        remark:
          type: string
    ConfirmPaymentRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
        comment:
          type: string
          description: 退回收款时必填。
    RefundType:
      type: string
      enum:
        - ORDER_CANCEL
        - OVERPAY
        - PRICE_ADJUSTMENT
        - CUSTOMER_BREACH
        - INTERNAL_CORRECTION
    RefundRequestStatus:
      type: string
      enum:
        - PENDING_APPROVAL
        - PENDING_EXECUTION
        - EXECUTING
        - COMPLETED
        - REJECTED
        - FAILED
        - CANCELLED
    RefundRequest:
      type: object
      properties:
        id:
          type: integer
        tranId:
          type: integer
        originalPaymentId:
          type: integer
        refundPaymentId:
          type: integer
        amount:
          type: number
        refundType:
          $ref: "#/components/schemas/RefundType"
        reason:
          type: string
        status:
          $ref: "#/components/schemas/RefundRequestStatus"
        requestedBy:
          type: integer
        requestedTime:
          type: string
          format: date-time
        approvedBy:
          type: integer
        approvedTime:
          type: string
          format: date-time
        approveComment:
          type: string
        executedBy:
          type: integer
        executionStartedTime:
          type: string
          format: date-time
        executedTime:
          type: string
          format: date-time
        executionRef:
          type: string
        executionRemark:
          type: string
        failureReason:
          type: string
    CreateRefundRequest:
      type: object
      required: [refundType, amount, reason]
      properties:
        refundType:
          $ref: "#/components/schemas/RefundType"
        amount:
          type: number
        reason:
          type: string
    ApproveRefundRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
        comment:
          type: string
          description: 驳回退款申请时必填。
    ExecuteRefundRequest:
      type: object
      properties:
        transactionRef:
          type: string
        remark:
          type: string
        success:
          type: boolean
          default: true
          description: 为空时按执行成功处理；false 表示记录外部退款执行失败。
        failureReason:
          type: string
          description: success=false 时必填。
    ImportResult:
      type: object
      properties:
        totalRows:
          type: integer
        validRows:
          type: integer
        failedRows:
          type: integer
        importedCount:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              column:
                type: string
              reason:
                type: string
    SummaryData:
      type: object
      description: 经营摘要指标，所有指标均按当前登录用户服务端数据范围聚合。
      properties:
        effectiveActivityCount:
          type: integer
          description: 当前范围内有效市场活动数。
        totalActivityCount:
          type: integer
          description: 当前范围内市场活动总数。
        totalClueCount:
          type: integer
          description: 当前范围内线索总数。
        totalCustomerCount:
          type: integer
          description: 当前范围内客户总数。
        successTranAmount:
          type: number
          format: decimal
          description: 当前范围内已完成交易金额。
        totalTranAmount:
          type: number
          format: decimal
          description: 当前范围内交易总金额。
    NameValue:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
