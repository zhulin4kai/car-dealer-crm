components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    LongId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TranId:
      name: tranId
      in: path
      required: true
      schema:
        type: integer
    Current:
      name: current
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
      description: 历史分页页码。
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
      description: 历史分页大小。
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
      description: 分页页码。
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
      description: 分页大小。

  requestBodies:
    IntegerArray:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: integer
    BatchIds:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BatchIdsRequest"

  responses:
    EmptyOk:
      description: 操作成功，无业务数据。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/R"
    BooleanOk:
      description: 操作成功，data 为布尔结果。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: boolean
    StringOk:
      description: 操作成功，data 为字符串结果。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: string
    ObjectOk:
      description: 查询成功，data 为对象。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
    ArrayOk:
      description: 查询成功，data 为数组。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
    NameValueArrayOk:
      description: 查询成功，data 为名称数值数组。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NameValue"
    PageOk:
      description: 分页查询成功，data 为 PageInfo。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PageInfo"
    UserObject:
      description: 查询成功，data 为当前用户对象。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
    UserDetailObject:
      description: 查询成功，data 为用户详情对象。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserDetailResponse"
    BadRequest:
      description: 请求参数错误。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    Unauthorized:
      description: 未认证、Token 无效或 Token 过期。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    Forbidden:
      description: 功能权限或数据权限不足。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    NotFound:
      description: 资源不存在。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    Conflict:
      description: 重复、并发冲突或非法状态迁移。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    Unprocessable:
      description: 请求格式正确但业务对象无法处理。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    ServerError:
      description: 未预期系统异常。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"

  schemas:
    R:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: 操作成功
        data:
          nullable: true
    ErrorR:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          example: 501
        msg:
          type: string
          example: 请求参数格式有误
        data:
          nullable: true
    PageInfo:
      type: object
      properties:
        pageNum:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
        pages:
          type: integer
        list:
          type: array
          items:
            type: object
            additionalProperties: true
    User:
      type: object
      properties:
        id:
          type: integer
        loginAct:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        roleList:
          type: array
          items:
            type: string
        permissionList:
          type: array
          items:
            type: string
    UserDetailResponse:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            accountNoExpired:
              type: integer
            credentialsNoExpired:
              type: integer
            accountNoLocked:
              type: integer
            accountEnabled:
              type: integer
            createTime:
              type: string
              format: date-time
            editTime:
              type: string
              format: date-time
            lastLoginTime:
              type: string
              format: date-time
    CreateUserRequest:
      type: object
      required: [loginAct, loginPwd, name]
      properties:
        loginAct:
          type: string
        loginPwd:
          type: string
          format: password
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
    UpdateUserRequest:
      type: object
      required: [id, loginAct, name]
      properties:
        id:
          type: integer
        loginAct:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
    BatchIdsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
    AssignUserRolesRequest:
      type: object
      required: [roleIds]
      properties:
        userId:
          type: integer
          description: 由路径 ID 覆盖，客户端无需提交。
        roleIds:
          type: array
          items:
            type: integer
    ChangePasswordRequest:
