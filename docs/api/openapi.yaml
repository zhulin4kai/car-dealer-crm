openapi: 3.0.3
info:
  title: 汽车经销商 CRM API
  version: 1.0.0
  description: 当前后端 Controller 暴露接口契约。统一规则见 docs/api/api-conventions.md。
servers:
  - url: http://localhost:8089
    description: 本地后端服务
security:
  - BearerAuth: []
tags:
  - name: Auth
    description: 登录态与当前用户
  - name: User
    description: 用户、角色和负责人
  - name: Clue
    description: 线索与线索备注
  - name: Customer
    description: 客户与线索转客户
  - name: Activity
    description: 市场活动与活动备注
  - name: Dictionary
    description: 数据字典类型和值
  - name: Product
    description: 车辆商品
  - name: ProductCategory
    description: 车辆商品分类
  - name: ProductPromotion
    description: 促销政策
  - name: ProductStock
    description: 商品库存调整记录
  - name: Transaction
    description: 交易、结算、审批、发票、收款和退款
  - name: Statistic
    description: 经营统计

paths:
  /api/login/info:
    get:
      tags: [Auth]
      operationId: getLoginInfo
      summary: 获取当前登录用户信息
      responses:
        "200":
          $ref: "#/components/responses/UserObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/login/free:
    get:
      tags: [Auth]
      operationId: checkLoginFree
      summary: 校验当前登录态是否有效
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/owner:
    get:
      tags: [User]
      operationId: listOwners
      summary: 查询可选负责人列表
      responses:
        "200":
          description: 查询成功，data 为用户对象数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/users:
    get:
      tags: [User]
      operationId: listUsers
      summary: 分页查询用户列表
      parameters:
        - $ref: "#/components/parameters/Current"
        - name: loginAct
          in: query
          schema:
            type: string
          description: 登录账号，模糊查询。
        - name: name
          in: query
          schema:
            type: string
          description: 用户姓名，模糊查询。
        - name: phone
          in: query
          schema:
            type: string
          description: 手机号，模糊查询。
        - name: email
          in: query
          schema:
            type: string
          description: 邮箱，模糊查询。
      responses:
        "200":
          $ref: "#/components/responses/PageOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user:
    post:
      tags: [User]
      operationId: createUser
      summary: 新增用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserDetailObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [User]
      operationId: updateUser
      summary: 更新用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserDetailObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}:
    get:
      tags: [User]
      operationId: getUser
      summary: 查询用户详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/UserDetailObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}/disable:
    put:
      tags: [User]
      operationId: disableUser
      summary: 禁用用户
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}/enable:
    put:
      tags: [User]
      operationId: enableUser
      summary: 启用用户
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}/lock:
    put:
      tags: [User]
      operationId: lockUser
      summary: 锁定用户
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}/unlock:
    put:
      tags: [User]
      operationId: unlockUser
      summary: 解锁用户
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/users/batch-disable:
    put:
      tags: [User]
      operationId: batchDisableUsers
      summary: 批量禁用用户
      requestBody:
        $ref: "#/components/requestBodies/BatchIds"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}/roles:
    put:
      tags: [User]
      operationId: assignUserRoles
      summary: 分配用户角色
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignUserRolesRequest"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}/password:
    put:
      tags: [User]
      operationId: changeUserPassword
      summary: 修改用户密码
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clues:
    get:
      tags: [Clue]
      operationId: listClues
      summary: 分页查询线索
      parameters:
        - $ref: "#/components/parameters/Current"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/PageOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/importExcel:
    post:
      tags: [Clue]
      operationId: importCluesFromExcel
      summary: 导入线索 Excel
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 仅支持 .xlsx，默认最大 5MB。
      responses:
        "200":
          description: 导入成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: 文件可解析但存在行级导入错误，data 返回 ImportResult。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ImportResult"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue:
    post:
      tags: [Clue]
      operationId: createClue
      summary: 新增线索
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ClueQuery"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [Clue]
      operationId: updateClue
      summary: 更新线索
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ClueQuery"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue/{phone}:
    get:
      tags: [Clue]
      operationId: checkCluePhone
      summary: 校验线索手机号是否可用
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
          description: 手机号。
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Clue]
      operationId: deleteClue
      summary: 删除线索
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: integer
          description: 当前实现路径变量名为 phone，删除语义实际传线索 ID。
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue/detail/{id}:
    get:
      tags: [Clue]
      operationId: getClue
      summary: 查询线索详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ObjectOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue/batch:
    post:
      tags: [Clue]
      operationId: batchDeleteClues
      summary: 批量删除线索
      requestBody:
        $ref: "#/components/requestBodies/IntegerArray"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue/remark:
    get:
      tags: [Clue]
      operationId: listClueRemarks
      summary: 分页查询线索备注
      parameters:
        - $ref: "#/components/parameters/Current"
        - name: clueId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/PageOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Clue]
      operationId: createClueRemark
      summary: 新增线索备注
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClueRemarkRequest"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/customer/list:
    get:
      tags: [Customer]
      operationId: listCustomers
      summary: 分页查询客户列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: customerName
          in: query
          schema:
            type: string
        - name: productId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          $ref: "#/components/responses/PageOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/customer/options:
    get:
      tags: [Customer]
      operationId: listCustomerOptions
      summary: 查询客户下拉选项
      responses:
        "200":
          $ref: "#/components/responses/ArrayOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/customer/{id}:
    get:
      tags: [Customer]
      operationId: getCustomer
      summary: 查询客户详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ObjectOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue/customer:
    post:
      tags: [Customer]
      operationId: convertClueToCustomer
      summary: 线索转客户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertCustomerRequest"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/customers:
    get:
      tags: [Customer]
      operationId: listCustomersDeprecated
      summary: 分页查询客户列表，历史接口
      deprecated: true
      parameters:
        - $ref: "#/components/parameters/Current"
      responses:
        "200":
          $ref: "#/components/responses/PageOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/exportExcel:
    get:
      tags: [Customer]
      operationId: exportCustomers
      summary: 导出客户 Excel
      parameters:
        - name: ids
          in: query
          required: false
          schema:
            type: string
          description: 逗号分隔客户 ID；为空时导出可见范围内客户。
      responses:
        "200":
          description: Excel 文件。
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/activitys:
    get:
      tags: [Activity]
      operationId: listActivities
      summary: 分页查询市场活动
      parameters:
        - $ref: "#/components/parameters/Current"
        - name: ownerId
          in: query
          schema:
            type: integer
        - name: name
          in: query
          schema:
            type: string
        - name: startTime
          in: query
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          $ref: "#/components/responses/PageOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/activity:
    post:
      tags: [Activity]
      operationId: createActivity
      summary: 新增市场活动
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ActivityQuery"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [Activity]
      operationId: updateActivity
      summary: 更新市场活动
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ActivityQuery"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/activity/{id}:
    get:
      tags: [Activity]
      operationId: getActivity
      summary: 查询市场活动详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ObjectOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Activity]
      operationId: deleteActivity
      summary: 删除市场活动
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/activity/batch:
    post:
      tags: [Activity]
      operationId: batchDeleteActivities
      summary: 批量删除市场活动
      requestBody:
