      tags: [Transaction]
      operationId: refundTransactionPayment
      summary: 旧退款接口
      deprecated: true
      description: 兼容旧客户端，服务端会拒绝直接退款；新流程使用退款申请、审批和执行接口。
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ObjectOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/tran/refund-requests/{tranId}:
    get:
      tags: [Transaction]
      operationId: listTransactionRefundRequests
      summary: 查询交易退款申请
      parameters:
        - $ref: "#/components/parameters/TranId"
      responses:
        "200":
          $ref: "#/components/responses/ArrayOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/tran/payment/{id}/refund-requests:
    post:
      tags: [Transaction]
      operationId: createTransactionRefundRequest
      summary: 创建退款申请
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "200":
          $ref: "#/components/responses/ObjectOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/tran/refund-requests/{id}/approve:
    put:
      tags: [Transaction]
      operationId: approveTransactionRefundRequest
      summary: 审批退款申请
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRefundRequest"
      responses:
        "200":
          $ref: "#/components/responses/ObjectOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/tran/refund-requests/{id}/execute:
    post:
      tags: [Transaction]
      operationId: executeTransactionRefundRequest
      summary: 执行退款
      description: 仅执行待执行退款申请；成功时先记录 EXECUTING 再新增负数退款流水并把申请标记为 COMPLETED，失败时标记为 FAILED 并保留失败原因；重复执行已完成或已失败申请返回当前申请状态，不覆盖原收款确认状态，不直接取消交易或释放库存。
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRefundRequest"
      responses:
        "200":
          $ref: "#/components/responses/RefundRequestObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/summary/data:
    get:
      tags: [Statistic]
      operationId: getSummaryData
      summary: 查询经营摘要指标
      description: 指标由后端按当前登录用户的数据范围聚合，前端不能传入范围参数扩大查询。
      responses:
        "200":
          $ref: "#/components/responses/ObjectOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/saleFunnel/data:
    get:
      tags: [Statistic]
      operationId: getSaleFunnelData
      summary: 查询销售漏斗数据
      description: 漏斗数量由后端按当前登录用户的数据范围聚合，必须与同范围明细可反算。
      responses:
        "200":
          $ref: "#/components/responses/NameValueArrayOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/sourcePie/data:
    get:
      tags: [Statistic]
      operationId: getSourcePieData
      summary: 查询线索来源占比数据
      description: 来源占比由后端按当前登录用户可访问线索范围聚合。
      responses:
        "200":
          $ref: "#/components/responses/NameValueArrayOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    LongId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TranId:
      name: tranId
      in: path
      required: true
      schema:
        type: integer
    Current:
      name: current
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
      description: 历史分页页码。
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
      description: 历史分页大小。
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
      description: 分页页码。
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
      description: 分页大小。

  requestBodies:
    IntegerArray:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: integer
    BatchIds:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BatchIdsRequest"

  responses:
    EmptyOk:
      description: 操作成功，无业务数据。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/R"
    BooleanOk:
      description: 操作成功，data 为布尔结果。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: boolean
    StringOk:
      description: 操作成功，data 为字符串结果。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: string
    ObjectOk:
      description: 查询成功，data 为对象。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
    SummaryDataOk:
      description: 查询成功，data 为经营摘要指标。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SummaryData"
    ClueObject:
      description: 查询成功，data 为线索详情。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Clue"
    ArrayOk:
      description: 查询成功，data 为数组。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
    ClueOwnerHistoryArrayOk:
      description: 查询成功，data 为线索责任历史数组。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClueOwnerHistory"
    NameValueArrayOk:
      description: 查询成功，data 为名称数值数组。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NameValue"
    PageOk:
      description: 分页查询成功，data 为 PageInfo。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PageInfo"
    CustomerPageOk:
      description: 分页查询成功，data.list 为客户列表响应；敏感字段由后端按权限脱敏。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PageInfo"
                      - type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: "#/components/schemas/CustomerListResponse"
    CustomerOptionArrayOk:
      description: 查询成功，data 为客户下拉选项数组。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomerOption"
    CustomerDetailObject:
      description: 查询成功，data 为客户详情；敏感字段由后端按权限脱敏。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CustomerDetailResponse"
    CustomerMergeObject:
      description: 合并成功，data 为本次迁移数量。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CustomerMergeResponse"
    CustomerDuplicateConflict:
      description: 客户联系方式疑似重复；越权重复只返回 hiddenConflict，不泄露客户敏感信息。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorR"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CustomerDuplicateResponse"
    UserObject:
      description: 查询成功，data 为当前用户对象。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
    UserDetailObject:
      description: 查询成功，data 为用户详情对象。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserDetailResponse"
    ProductVehicleObject:
      description: 库存车辆实例命令成功，data 为车辆实例当前状态。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProductVehicle"
    DeliveryObject:
      description: 交付命令或详情查询成功，data 为交付记录。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Delivery"
    DeliveryPageOk:
      description: 分页查询成功，data.list 为交付记录数组。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PageInfo"
                      - type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: "#/components/schemas/Delivery"
    DeliveryArrayOk:
      description: 查询成功，data 为交付记录数组。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Delivery"
    DeliveryCheckItemObject:
      description: 交付准备项命令成功，data 为准备项当前状态。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DeliveryCheckItem"
    DeliveryCheckItemArrayOk:
      description: 查询成功，data 为交付准备项数组。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeliveryCheckItem"
    QuoteObject:
      description: 报价状态命令成功，data 为报价对象。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Quote"
    QuoteDetailObject:
      description: 报价命令或详情查询成功，data 为报价详情。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/QuoteDetail"
    QuoteVersionArrayOk:
      description: 查询成功，data 为报价版本数组。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuoteVersion"
    TransactionPaymentObject:
      description: 收款命令成功，data 为收款或退款流水。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TransactionPayment"
    TransactionPaymentArrayOk:
      description: 查询成功，data 为收款退款流水数组。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TransactionPayment"
    RefundRequestObject:
      description: 退款申请命令成功，data 为退款申请当前状态。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RefundRequest"
    RefundRequestArrayOk:
      description: 查询成功，data 为退款申请数组。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RefundRequest"
    TransactionInvoiceObject:
      description: 发票命令成功，data 为交易发票当前记录。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TransactionInvoice"
    TransactionInvoiceArrayOk:
      description: 查询成功，data 为交易发票数组；无敏感权限时税号、账号、地址、电话等字段由后端脱敏。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TransactionInvoice"
    BadRequest:
      description: 请求参数错误。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    Unauthorized:
      description: 未认证、Token 无效或 Token 过期。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    Forbidden:
      description: 功能权限或数据权限不足。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    NotFound:
      description: 资源不存在。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    Conflict:
      description: 重复、并发冲突或非法状态迁移。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    Unprocessable:
      description: 请求格式正确但业务对象无法处理。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    ServerError:
      description: 未预期系统异常。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"

  schemas:
    R:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: 操作成功
        data:
          nullable: true
    ErrorR:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          example: 501
        msg:
          type: string
          example: 请求参数格式有误
        data:
          nullable: true
    PageInfo:
      type: object
      properties:
        pageNum:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
        pages:
          type: integer
        list:
          type: array
          items:
            type: object
            additionalProperties: true
    User:
      type: object
      properties:
        id:
          type: integer
        loginAct:
          type: string
        name:
          type: string
        phone:
          type: string
          description: 手机号；服务端会去除空格、横杠和括号等常见分隔符后按大陆手机号校验和存储。
        email:
          type: string
        roleList:
          type: array
          items:
            type: string
        permissionList:
          type: array
          items:
            type: string
    UserDetailResponse:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            accountNoExpired:
              type: integer
            credentialsNoExpired:
              type: integer
            accountNoLocked:
              type: integer
            accountEnabled:
              type: integer
            createTime:
              type: string
              format: date-time
            editTime:
              type: string
              format: date-time
            lastLoginTime:
              type: string
              format: date-time
    CreateUserRequest:
      type: object
      required: [loginAct, loginPwd, name]
      properties:
        loginAct:
          type: string
        loginPwd:
          type: string
          format: password
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
    UpdateUserRequest:
      type: object
      required: [id, loginAct, name]
      properties:
        id:
          type: integer
        loginAct:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
    BatchIdsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
    AssignUserRolesRequest:
      type: object
      required: [roleIds]
      properties:
        userId:
          type: integer
          description: 由路径 ID 覆盖，客户端无需提交。
        roleIds:
          type: array
          items:
            type: integer
    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        userId:
          type: integer
          description: 由路径 ID 覆盖，客户端无需提交。
        newPassword:
          type: string
          format: password
    HandoverUserResponsibilitiesRequest:
      type: object
      required: [targetUserId, reason]
      properties:
        targetUserId:
          type: integer
          description: 目标负责人 ID，必须为启用、未锁定且具备销售职责的账号。
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: 交接原因。
    HandoverUserResponsibilitiesResponse:
      type: object
      required: [sourceUserId, targetUserId, activityCount, clueCount, customerCount]
      properties:
        sourceUserId:
          type: integer
        targetUserId:
          type: integer
        activityCount:
          type: integer
        clueCount:
          type: integer
        customerCount:
          type: integer
    ClueQuery:
      type: object
      properties:
        id:
          type: integer
        ownerId:
          type: integer
        activityId:
          type: integer
        fullName:
          type: string
        appellation:
          type: integer
        phone:
          type: string
        weixin:
          type: string
        qq:
          type: string
        email:
          type: string
          format: email
        age:
          type: integer
        job:
          type: string
        yearIncome:
          type: number
        address:
          type: string
        needLoan:
          type: integer
        intentionState:
          type: integer
        intentionProduct:
