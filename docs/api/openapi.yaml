      operationId: executeTransactionRefundRequest
      summary: 执行退款
      description: 仅执行 PAYMENT、DELIVERY 或 CANCELLED 交易下的待执行退款申请；成功时先记录 EXECUTING 再新增负数退款流水并把申请标记为 COMPLETED，失败时标记为 FAILED 并保留失败原因；重复执行已完成或已失败申请返回当前申请状态，不覆盖原收款确认状态，不直接取消交易或释放库存。超出当前可退金额时返回 409，错误 data.availableAmount 为服务端计算的当前可退余额。
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRefundRequest"
      responses:
        "200":
          $ref: "#/components/responses/RefundRequestObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/summary/data:
    get:
      tags: [Statistic]
      operationId: getSummaryData
      summary: 查询经营摘要指标
      description: 指标由后端按当前登录用户的数据范围聚合，前端不能传入范围参数扩大查询。
      responses:
        "200":
          $ref: "#/components/responses/SummaryDataOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/saleFunnel/data:
    get:
      tags: [Statistic]
      operationId: getSaleFunnelData
      summary: 查询销售漏斗数据
      description: 漏斗数量由后端按当前登录用户的数据范围聚合，必须与同范围明细可反算。
