openapi: 3.0.3
info:
  title: 汽车经销商 CRM API
  version: 1.0.0
  description: 当前后端 Controller 暴露接口契约。统一规则见 docs/api/api-conventions.md。
servers:
  - url: http://localhost:8089
    description: 本地后端服务
security:
  - BearerAuth: []
tags:
  - name: Auth
    description: 登录态与当前用户
  - name: User
    description: 用户、角色和负责人
  - name: Clue
    description: 线索与线索备注
  - name: Customer
    description: 客户与线索转客户
  - name: Activity
    description: 市场活动与活动备注
  - name: Dictionary
    description: 数据字典类型和值
  - name: Product
    description: 车辆商品
  - name: ProductCategory
    description: 车辆商品分类
  - name: ProductPromotion
    description: 促销政策
  - name: ProductStock
    description: 商品库存调整记录
  - name: Quote
    description: 报价、报价版本和报价状态
  - name: Delivery
    description: 交付记录、准备清单、签收和异常
  - name: Opportunity
    description: 商机、销售阶段、输赢单和阶段历史
  - name: TestDrive
    description: 试驾预约、改期、签到、完成、取消和爽约
  - name: Follow
    description: 跟进任务和沟通记录
  - name: Transaction
    description: 交易、结算、审批、发票、收款和退款
  - name: Audit
    description: 登录记录和操作审计
  - name: Statistic
    description: 经营统计
  - name: AI
    description: AI 业务助手、Run、SSE、ToolRegistry 和低风险 Proposal

paths:
  /api/ai/conversations:
    get:
      tags: [AI]
      operationId: listAiConversations
      summary: 查询当前用户 AI 会话列表
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 查询成功，data 为 AI Conversation 数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AiConversationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [AI]
      operationId: createAiConversation
      summary: 创建 AI Conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAiConversationRequest"
      responses:
        "200":
          description: 创建成功，data 为 AI Conversation。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiConversationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/conversations/{conversationNo}:
    get:
      tags: [AI]
      operationId: getAiConversation
      summary: 查询 AI Conversation 详情
      parameters:
        - name: conversationNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 查询成功，data 为会话、消息、最近 Run 和可恢复状态。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiConversationDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/conversations/{conversationNo}/title:
    patch:
      tags: [AI]
      operationId: renameAiConversation
      summary: 重命名 AI Conversation
      parameters:
        - name: conversationNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameAiConversationRequest"
      responses:
        "200":
          description: 重命名成功，data 为 AI Conversation。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiConversationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/conversations/{conversationNo}/archive:
    post:
      tags: [AI]
      operationId: archiveAiConversation
      summary: 归档 AI Conversation
      parameters:
        - name: conversationNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 归档成功，data 为 AI Conversation。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiConversationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/runs:
    post:
      tags: [AI]
      operationId: createAiRun
      summary: 创建 AI Run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAiRunRequest"
      responses:
        "200":
          description: 创建成功，data 为 AI Run。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/runs/{runNo}:
    get:
      tags: [AI]
      operationId: getAiRun
      summary: 查询 AI Run 状态
      parameters:
        - name: runNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 查询成功，data 为 AI Run。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/runs/{runNo}/trace:
    get:
      tags: [AI]
      operationId: getAiRunTrace
      summary: 查询 AI Run 可恢复追踪
      parameters:
        - name: runNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 查询成功，data 为 AI Run、消息、工具调用、Proposal、Approval 和执行事件。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiRunTraceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/runs/{runNo}/events:
    get:
      tags: [AI]
      operationId: streamAiRunEvents
      summary: 订阅 AI Run SSE 事件
      parameters:
        - name: runNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE 事件流。事件 data 为 AiSseEventResponse JSON。
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/runs/{runNo}/cancel:
    post:
      tags: [AI]
      operationId: cancelAiRun
      summary: 停止 AI Run 生成
      parameters:
        - name: runNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAiRunRequest"
      responses:
        "200":
          description: 停止成功或幂等返回当前 Run 状态。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/provider-configs:
    get:
      tags: [AI]
      operationId: listAiProviderConfigs
      summary: 查询 AI 模型配置列表
      responses:
        "200":
          description: 查询成功，data 为脱敏配置列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AiProviderConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [AI]
      operationId: createAiProviderConfig
      summary: 创建 AI 模型配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAiProviderConfigRequest"
      responses:
        "200":
          $ref: "#/components/responses/AiProviderConfigOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/provider-configs/{configNo}:
    put:
      tags: [AI]
      operationId: updateAiProviderConfig
      summary: 更新 AI 模型配置基础字段
      parameters:
        - $ref: "#/components/parameters/AiProviderConfigNo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAiProviderConfigRequest"
      responses:
        "200":
          $ref: "#/components/responses/AiProviderConfigOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/provider-configs/{configNo}/rotate-key:
    post:
      tags: [AI]
      operationId: rotateAiProviderKey
      summary: 轮换 AI 模型配置 API Key
      parameters:
        - $ref: "#/components/parameters/AiProviderConfigNo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateAiProviderKeyRequest"
      responses:
        "200":
          $ref: "#/components/responses/AiProviderConfigOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/provider-configs/{configNo}/test:
    post:
      tags: [AI]
      operationId: testAiProviderConfig
      summary: 测试 AI 模型配置连接
      parameters:
        - $ref: "#/components/parameters/AiProviderConfigNo"
      responses:
        "200":
          description: 测试完成，data 为脱敏测试结果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiProviderConfigTestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/provider-configs/{configNo}/activate:
    post:
      tags: [AI]
      operationId: activateAiProviderConfig
      summary: 启用 AI 模型配置
      parameters:
        - $ref: "#/components/parameters/AiProviderConfigNo"
      responses:
        "200":
          $ref: "#/components/responses/AiProviderConfigOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/provider-configs/{configNo}/disable:
    post:
      tags: [AI]
      operationId: disableAiProviderConfig
      summary: 停用 AI 模型配置
      parameters:
        - $ref: "#/components/parameters/AiProviderConfigNo"
      responses:
        "200":
          $ref: "#/components/responses/AiProviderConfigOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/proposals/{proposalId}/confirm:
    post:
      tags: [AI]
      operationId: confirmAiProposal
      summary: 确认低风险 AI Proposal
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 确认成功，data 为执行结果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiProposalConfirmResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/proposals/{proposalId}/reject:
    post:
      tags: [AI]
      operationId: rejectAiProposal
      summary: 拒绝低风险 AI Proposal
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 拒绝成功，data 为 Proposal 状态。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiProposalConfirmResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /internal/ai/tools/{toolName}/execute:
    post:
      tags: [AI]
      operationId: executeInternalAiTool
      summary: dealer-ai 调用 Spring Boot ToolRegistry
      security: []
      parameters:
        - name: toolName
          in: path
          required: true
          schema:
            type: string
        - name: X-Dealer-AI-Tool-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteAiToolRequest"
      responses:
        "200":
          description: 执行成功，data 为工具结构化结果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiToolExecutionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/workflows:
    post:
      tags: [AI]
      operationId: createAiWorkflow
      summary: 创建受控 AI 工作流
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAiWorkflowRequest"
      responses:
        "200":
          description: 创建成功，data 为工作流和步骤。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiWorkflowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [AI]
      operationId: listAiWorkflows
      summary: 查询 AI Run 下的受控工作流
      parameters:
        - name: runNo
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 查询成功，data 为工作流列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AiWorkflowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/workflows/{workflowNo}:
    get:
      tags: [AI]
      operationId: getAiWorkflow
      summary: 查询受控 AI 工作流详情
      parameters:
        - name: workflowNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 查询成功，data 为工作流和步骤。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiWorkflowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/workflows/{workflowNo}/pause:
    post:
      tags: [AI]
      operationId: pauseAiWorkflow
      summary: 暂停受控 AI 工作流
      parameters:
        - $ref: "#/components/parameters/AiWorkflowNo"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiWorkflowActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/AiWorkflowOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/workflows/{workflowNo}/resume:
    post:
      tags: [AI]
      operationId: resumeAiWorkflow
      summary: 恢复受控 AI 工作流
      parameters:
        - $ref: "#/components/parameters/AiWorkflowNo"
      responses:
        "200":
          $ref: "#/components/responses/AiWorkflowOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/workflows/{workflowNo}/cancel:
    post:
      tags: [AI]
      operationId: cancelAiWorkflow
      summary: 取消受控 AI 工作流
      parameters:
        - $ref: "#/components/parameters/AiWorkflowNo"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiWorkflowActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/AiWorkflowOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/workflows/{workflowNo}/fail:
    post:
      tags: [AI]
      operationId: failAiWorkflow
      summary: 标记受控 AI 工作流失败
      parameters:
        - $ref: "#/components/parameters/AiWorkflowNo"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiWorkflowActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/AiWorkflowOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai/proactive/subscriptions:
    post:
