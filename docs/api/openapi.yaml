        turnNo:
          type: integer
        status:
          $ref: "#/components/schemas/AiRunStatus"
        userMessage:
          $ref: "#/components/schemas/AiTraceMessage"
        assistantMessage:
          $ref: "#/components/schemas/AiTraceMessage"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AiTraceMessage"
        toolResults:
          type: array
          items:
            $ref: "#/components/schemas/AiTraceToolCall"
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/AiTraceProposal"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/AiTraceApproval"
        executionEvents:
          type: array
          items:
            $ref: "#/components/schemas/AiTraceExecutionEvent"
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/AiWorkflowResponse"
    AiRunResponse:
      type: object
      properties:
        runNo:
          type: string
        conversationNo:
          type: string
        turnNo:
          type: integer
        status:
          $ref: "#/components/schemas/AiRunStatus"
        entryPoint:
          $ref: "#/components/schemas/AiEntryPoint"
        contextObjectType:
          type: string
        contextObjectId:
          type: string
        promptSummary:
          type: string
        errorCode:
          type: string
        errorMessage:
          type: string
        createTime:
          type: string
          format: date-time
        startedTime:
          type: string
          format: date-time
        completedTime:
          type: string
          format: date-time
        expiresTime:
          type: string
          format: date-time
    AiRunTraceResponse:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/AiRunResponse"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AiTraceMessage"
        toolCalls:
          type: array
          items:
            $ref: "#/components/schemas/AiTraceToolCall"
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/AiTraceProposal"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/AiTraceApproval"
        executionEvents:
          type: array
          items:
            $ref: "#/components/schemas/AiTraceExecutionEvent"
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/AiWorkflowResponse"
    AiTraceMessage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        role:
          type: string
          enum: [USER, ASSISTANT, SYSTEM]
        sequenceNo:
          type: integer
        visibleToUser:
          type: boolean
        contentSummary:
          type: string
        createTime:
          type: string
          format: date-time
    AiTraceToolCall:
      type: object
      properties:
        id:
          type: integer
          format: int64
        toolName:
          type: string
        permissionCode:
          type: string
        riskLevel:
          $ref: "#/components/schemas/AiRiskLevel"
        inputSummary:
          type: string
        outputSummary:
          type: string
        objectRefs:
          type: string
        displayPayload:
          description: 脱敏后的前端展示 payload，只用于恢复业务卡片。
          nullable: true
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
        resultStatus:
          type: string
        errorCode:
          type: string
        durationMs:
          type: integer
        startedTime:
          type: string
          format: date-time
        completedTime:
          type: string
          format: date-time
    AiTraceProposal:
      type: object
      properties:
        id:
          type: integer
          format: int64
        proposalType:
          type: string
          enum: [create_communication_record_proposal, create_follow_task_proposal]
        status:
          $ref: "#/components/schemas/AiProposalStatus"
        riskLevel:
          $ref: "#/components/schemas/AiRiskLevel"
        permissionCode:
          type: string
        relatedObjectType:
          type: string
        relatedObjectId:
          type: string
        paramsSummary:
          type: string
        impactSummary:
          type: string
        expiresTime:
          type: string
          format: date-time
        confirmedTime:
          type: string
          format: date-time
        executedTime:
          type: string
          format: date-time
        resultSummary:
          type: string
        errorCode:
          type: string
        createTime:
          type: string
          format: date-time
    AiTraceApproval:
      type: object
      properties:
        id:
          type: integer
          format: int64
        proposalId:
          type: integer
          format: int64
        decision:
          type: string
          enum: [CONFIRMED, REJECTED, EXPIRED]
        permissionSummary:
          type: string
        reason:
          type: string
        resultStatus:
          type: string
        approvedTime:
          type: string
          format: date-time
    AiTraceExecutionEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        proposalId:
          type: integer
          format: int64
        eventType:
          type: string
        resultStatus:
          type: string
        objectType:
          type: string
        objectId:
          type: string
        summary:
          type: string
        errorCode:
          type: string
        occurredTime:
          type: string
          format: date-time
    AiSseEventResponse:
      type: object
      properties:
        eventId:
          type: string
        runNo:
          type: string
        sequence:
          type: integer
        type:
          type: string
          enum:
            - run_started
            - message_delta
            - message_completed
            - tool_call_started
            - tool_call_completed
            - proposal_created
            - workflow_started
            - workflow_step_started
            - workflow_step_completed
            - workflow_waiting_user_confirmation
            - workflow_paused
            - workflow_resumed
