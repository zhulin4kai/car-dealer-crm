openapi: 3.0.3
info:
  title: 汽车经销商 CRM API
  version: 1.0.0
  description: 当前后端 Controller 暴露接口契约。统一规则见 docs/api/api-conventions.md。
servers:
  - url: http://localhost:8089
    description: 本地后端服务
security:
  - BearerAuth: []
tags:
  - name: Auth
    description: 登录态与当前用户
  - name: User
    description: 用户、角色和负责人
  - name: Clue
    description: 线索与线索备注
  - name: Customer
    description: 客户与线索转客户
  - name: Activity
    description: 市场活动与活动备注
  - name: Dictionary
    description: 数据字典类型和值
  - name: Product
    description: 车辆商品
  - name: ProductCategory
    description: 车辆商品分类
  - name: ProductPromotion
    description: 促销政策
  - name: ProductStock
    description: 商品库存调整记录
  - name: Quote
    description: 报价、报价版本和报价状态
  - name: Delivery
    description: 交付记录、准备清单、签收和异常
  - name: Transaction
    description: 交易、结算、审批、发票、收款和退款
  - name: Statistic
    description: 经营统计

paths:
  /api/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 登录并获取 JWT
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [loginAct, loginPwd]
              properties:
                loginAct:
                  type: string
                  description: 登录账号。
                loginPwd:
                  type: string
                  format: password
                  description: 登录密码。
                rememberMe:
                  type: boolean
                  description: 是否延长登录有效期。
      responses:
        "200":
          $ref: "#/components/responses/StringOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 退出登录并清理当前 JWT
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/login/info:
    get:
      tags: [Auth]
      operationId: getLoginInfo
      summary: 获取当前登录用户信息
      responses:
        "200":
          $ref: "#/components/responses/UserObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/login/free:
    get:
      tags: [Auth]
      operationId: checkLoginFree
      summary: 校验当前登录态是否有效
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/owner:
    get:
      tags: [User]
      operationId: listOwners
      summary: 查询可选负责人列表
      responses:
        "200":
          description: 查询成功，data 为用户对象数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/users:
    get:
      tags: [User]
      operationId: listUsers
      summary: 分页查询用户列表
      parameters:
        - $ref: "#/components/parameters/Current"
        - name: loginAct
          in: query
          schema:
            type: string
          description: 登录账号，模糊查询。
        - name: name
          in: query
          schema:
            type: string
          description: 用户姓名，模糊查询。
        - name: phone
          in: query
          schema:
            type: string
          description: 手机号，模糊查询。
        - name: email
          in: query
          schema:
            type: string
          description: 邮箱，模糊查询。
      responses:
        "200":
          $ref: "#/components/responses/PageOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user:
    post:
      tags: [User]
      operationId: createUser
      summary: 新增用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserDetailObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [User]
      operationId: updateUser
      summary: 更新用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserDetailObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}:
    get:
      tags: [User]
      operationId: getUser
      summary: 查询用户详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/UserDetailObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}/disable:
    put:
      tags: [User]
      operationId: disableUser
      summary: 禁用用户
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}/enable:
    put:
      tags: [User]
      operationId: enableUser
      summary: 启用用户
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}/lock:
    put:
      tags: [User]
      operationId: lockUser
      summary: 锁定用户
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}/unlock:
    put:
      tags: [User]
      operationId: unlockUser
      summary: 解锁用户
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/users/batch-disable:
    put:
      tags: [User]
      operationId: batchDisableUsers
      summary: 批量禁用用户
      requestBody:
        $ref: "#/components/requestBodies/BatchIds"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}/roles:
    put:
      tags: [User]
      operationId: assignUserRoles
      summary: 分配用户角色
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignUserRolesRequest"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}/password:
    put:
      tags: [User]
      operationId: changeUserPassword
      summary: 修改用户密码
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/{id}/handover:
    put:
      tags: [User]
      operationId: handoverUserResponsibilities
      summary: 交接用户当前负责业务对象
      description: 将原负责人当前负责的活动、线索和客户整体交接给有效销售负责人；商机、试驾、跟进任务等对象由对应业务域落地负责人字段后纳入。
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoverUserResponsibilitiesRequest"
      responses:
        "200":
          description: 交接成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HandoverUserResponsibilitiesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clues:
    get:
      tags: [Clue]
      operationId: listClues
      summary: 分页查询线索
      parameters:
        - $ref: "#/components/parameters/Current"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/PageOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/importExcel:
    post:
      tags: [Clue]
      operationId: importCluesFromExcel
      summary: 导入线索 Excel
      description: 导入逐行校验并归一化手机号；同文件或数据库中归一化后重复的手机号返回行级错误摘要。存在失败行时返回 422，但合法行可以通过 importedCount 表示已成功导入。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 仅支持 .xlsx，默认最大 5MB。
      responses:
        "200":
          description: 导入成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: 文件可解析但存在行级导入错误，data 返回 ImportResult；合法行可能已经导入成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/R"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ImportResult"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue:
    post:
      tags: [Clue]
      operationId: createClue
      summary: 新增线索
      description: 手机号先去除空格、横杠和括号等常见分隔符，再由生产和测试 Schema 的唯一约束兜底；并发重复手机号返回 409 DUPLICATE。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ClueQuery"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ClueQuery"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [Clue]
      operationId: updateClue
      summary: 更新线索
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ClueQuery"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ClueQuery"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue/{phone}:
    get:
      tags: [Clue]
      operationId: checkCluePhone
      summary: 校验线索手机号是否可用
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
          description: 手机号；服务端按常见分隔符归一化后检查是否可用。
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Clue]
      operationId: deleteClue
      summary: 删除线索
      description: 删除前校验客户引用；已转客户或存在客户引用的线索返回 422 RESOURCE_IN_USE，不删除线索备注和线索主体。
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: integer
          description: 当前实现路径变量名为 phone，删除语义实际传线索 ID。
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue/detail/{id}:
    get:
      tags: [Clue]
      operationId: getClue
      summary: 查询线索详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ClueObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue/{id}/owner:
    put:
      tags: [Clue]
      operationId: transferClueOwner
      summary: 转派线索负责人
      description: 转派必须提交目标负责人和原因；后端校验数据范围、目标负责人资格并写入责任历史。
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferClueOwnerRequest"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue/{id}/owner-history:
    get:
      tags: [Clue]
      operationId: listClueOwnerHistory
      summary: 查询线索责任历史
      description: 查询前按当前用户数据范围校验线索访问权限。
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ClueOwnerHistoryArrayOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue/{id}/close:
    put:
      tags: [Clue]
      operationId: closeClue
      summary: 关闭线索
      description: 关闭必须提交原因；后端校验数据范围、当前状态和影响行数，并写入操作审计。
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClueLifecycleRequest"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue/{id}/restore:
    put:
      tags: [Clue]
      operationId: restoreClue
      summary: 恢复线索
      description: 恢复必须提交原因；后端校验数据范围、关闭状态、重复活跃线索和影响行数，并写入操作审计。
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClueLifecycleRequest"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue/batch:
    post:
      tags: [Clue]
      operationId: batchDeleteClues
      summary: 批量删除线索
      description: 批量删除先完成全部访问权限和客户引用检查；任一线索被客户引用时整个批次返回 422 RESOURCE_IN_USE，不删除任何历史。
      requestBody:
        $ref: "#/components/requestBodies/IntegerArray"
      responses:
        "200":
          $ref: "#/components/responses/EmptyOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/clue/remark:
    get:
      tags: [Clue]
      operationId: listClueRemarks
      summary: 分页查询线索备注
      parameters:
        - $ref: "#/components/parameters/Current"
        - name: clueId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/PageOk"
        "401":
