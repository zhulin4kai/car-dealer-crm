        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    NotFound:
      description: 资源不存在。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    Conflict:
      description: 重复、并发冲突或非法状态迁移。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    Unprocessable:
      description: 请求格式正确但业务对象无法处理。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"
    ServerError:
      description: 未预期系统异常。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorR"

  schemas:
    R:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: 操作成功
        data:
          nullable: true
    ErrorR:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          example: 501
        msg:
          type: string
          example: 请求参数格式有误
        data:
          nullable: true
    PageInfo:
      type: object
      required: [pageNum, pageSize, total, pages, list]
      properties:
        pageNum:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
        pages:
          type: integer
        list:
          type: array
          items:
            type: object
            additionalProperties: true
    AiEntryPoint:
      type: string
      enum: [PAGE, SIDE_PANEL]
    AiRunStatus:
      type: string
      enum: [CREATED, RUNNING, WAITING_FOR_APPROVAL, COMPLETED, FAILED, CANCELLED, EXPIRED]
    AiConversationStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    AiProposalStatus:
      type: string
      enum: [PENDING_CONFIRMATION, CONFIRMED, REJECTED, EXPIRED, EXECUTED, FAILED]
    AiRiskLevel:
      type: string
      enum: [READONLY, LOW, MEDIUM, HIGH]
    AiWorkflowStatus:
      type: string
      enum: [CREATED, RUNNING, PAUSED, WAITING_USER_CONFIRMATION, COMPLETED, FAILED, CANCELLED, EXPIRED]
    AiWorkflowStepStatus:
      type: string
      enum: [PENDING, RUNNING, WAITING_USER_CONFIRMATION, COMPLETED, FAILED, CANCELLED, EXPIRED]
    AiWorkflowType:
      type: string
      enum: [CUSTOMER_FOLLOW_UP, TRANSACTION_GAP_REVIEW, INVENTORY_RISK_REVIEW]
    AiProviderFormat:
      type: string
      enum: [OPENAI_COMPATIBLE, ANTHROPIC]
    AiProviderTestStatus:
      type: string
      enum: [UNTESTED, SUCCESS, FAILED]
    AiProactiveSubscriptionType:
      type: string
      enum: [FOLLOW_UP_REMINDER, TRANSACTION_EXCEPTION, INVENTORY_ALERT, DAILY_SUMMARY, PERIODIC_SALES_ANALYSIS]
    AiProactiveFrequency:
      type: string
      enum: [REALTIME_LIMITED, DAILY, WEEKLY, MONTHLY]
    AiProactiveSubscriptionStatus:
      type: string
      enum: [ACTIVE, PAUSED, CANCELLED]
    AiProactiveEventStatus:
      type: string
      enum: [CREATED, GENERATING, READY, NO_DATA, FAILED, SKIPPED]
    CreateAiRunRequest:
      type: object
      required: [prompt, entryPoint]
      properties:
        conversationNo:
          type: string
          maxLength: 64
          description: 目标 Conversation；未传时由后端按当前用户和业务对象上下文解析或创建默认会话。
        prompt:
          type: string
          maxLength: 4000
        entryPoint:
          $ref: "#/components/schemas/AiEntryPoint"
        contextObjectType:
          type: string
          maxLength: 64
        contextObjectId:
          type: string
          maxLength: 64
    CreateAiConversationRequest:
      type: object
      required: [entryPoint]
      properties:
        title:
          type: string
          maxLength: 128
        entryPoint:
          $ref: "#/components/schemas/AiEntryPoint"
        contextObjectType:
          type: string
          maxLength: 64
        contextObjectId:
          type: string
          maxLength: 64
    RenameAiConversationRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
    CancelAiRunRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    CreateAiProviderConfigRequest:
      type: object
      required: [providerName, providerFormat, baseUrl, modelName, modelDisplayName, apiKey]
      properties:
        providerName:
          type: string
          maxLength: 64
        providerFormat:
          $ref: "#/components/schemas/AiProviderFormat"
        baseUrl:
          type: string
          maxLength: 255
          example: https://api.deepseek.com
        modelName:
          type: string
          maxLength: 128
        modelDisplayName:
          type: string
          maxLength: 128
        apiKey:
          type: string
          maxLength: 500
          writeOnly: true
          description: 仅请求中提交，响应、SSE、trace 和日志禁止返回明文。
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 60
          default: 15
        maxOutputTokens:
          type: integer
          minimum: 1
          maximum: 4096
          default: 512
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
    UpdateAiProviderConfigRequest:
      type: object
      required: [providerName, providerFormat, baseUrl, modelName, modelDisplayName]
      properties:
        providerName:
          type: string
          maxLength: 64
        providerFormat:
          $ref: "#/components/schemas/AiProviderFormat"
        baseUrl:
          type: string
          maxLength: 255
        modelName:
          type: string
          maxLength: 128
        modelDisplayName:
          type: string
          maxLength: 128
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 60
        maxOutputTokens:
          type: integer
          minimum: 1
          maximum: 4096
        temperature:
          type: number
          minimum: 0
          maximum: 2
    RotateAiProviderKeyRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          maxLength: 500
          writeOnly: true
          description: 仅用于轮换密钥，响应永不返回明文。
    AiProviderConfigResponse:
      type: object
      properties:
        configNo:
          type: string
        providerName:
          type: string
        providerFormat:
          $ref: "#/components/schemas/AiProviderFormat"
        baseUrl:
          type: string
        modelName:
          type: string
        modelDisplayName:
          type: string
        hasApiKey:
          type: boolean
        maskedApiKey:
          type: string
          description: API Key 掩码，不是明文。
        enabled:
          type: boolean
        testStatus:
          $ref: "#/components/schemas/AiProviderTestStatus"
        lastTestTime:
          type: string
          format: date-time
        lastTestErrorCode:
          type: string
        lastTestMessage:
          type: string
        timeoutSeconds:
          type: integer
        maxOutputTokens:
          type: integer
        temperature:
          type: number
        createTime:
          type: string
          format: date-time
        editTime:
          type: string
          format: date-time
    AiProviderConfigTestResponse:
      type: object
      properties:
        configNo:
          type: string
        testStatus:
          $ref: "#/components/schemas/AiProviderTestStatus"
        message:
          type: string
        errorCode:
          type: string
    AiConversationResponse:
      type: object
      properties:
        conversationNo:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/AiConversationStatus"
        entryPoint:
          $ref: "#/components/schemas/AiEntryPoint"
        contextObjectType:
          type: string
        contextObjectId:
          type: string
        summaryText:
          type: string
        lastRunNo:
          type: string
        lastMessageTime:
          type: string
          format: date-time
        createTime:
          type: string
          format: date-time
        editTime:
          type: string
          format: date-time
    AiConversationDetailResponse:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/AiConversationResponse"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AiTraceMessage"
