        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    LongId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TranId:
      name: tranId
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      required: false
