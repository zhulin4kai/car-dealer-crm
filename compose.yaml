name: car-dealer-crm-demo

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: car-dealer-crm-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-car_dealer_crm}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init/01-load-demo.sh:/docker-entrypoint-initdb.d/01-load-demo.sh:ro
      - ./dealer-server/src/main/resources/CarDealerCRM.sql:/docker-entrypoint-demo/CarDealerCRM.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: car-dealer-crm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  ai:
    container_name: car-dealer-crm-ai
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/dealer-ai.Dockerfile
      args:
        DOCKERHUB_LIBRARY_PREFIX: ${DOCKERHUB_LIBRARY_PREFIX:-}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      # Spring 与 Python 统一读取同一个环境名，Python 仍兼容旧变量。
      DEALER_AI_ENV: ${DEALER_AI_ENV:-local}
      DEALER_AI_INTERNAL_TOKEN: ${DEALER_AI_INTERNAL_TOKEN:?DEALER_AI_INTERNAL_TOKEN must be set}
      DEALER_AI_SPRING_TOOL_BASE_URL: http://server:8089/internal/ai
      DEALER_AI_SPRING_TOOL_TOKEN: ${DEALER_AI_TOOL_TOKEN:?DEALER_AI_TOOL_TOKEN must be set}
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  server:
    container_name: car-dealer-crm-server
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/dealer-server.Dockerfile
      args:
        DOCKERHUB_LIBRARY_PREFIX: ${DOCKERHUB_LIBRARY_PREFIX:-}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-car_dealer_crm}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-car-dealer-crm-local-secret}
      DEALER_AI_ENV: ${DEALER_AI_ENV:-local}
      DEALER_AI_BASE_URL: http://ai:8091
      DEALER_AI_INTERNAL_TOKEN: ${DEALER_AI_INTERNAL_TOKEN:?DEALER_AI_INTERNAL_TOKEN must be set}
      DEALER_AI_TOOL_TOKEN: ${DEALER_AI_TOOL_TOKEN:?DEALER_AI_TOOL_TOKEN must be set}
      AI_PROVIDER_KEY_ENCRYPTION_SECRET_FILE: /root/.car-dealer-crm/ai-provider-key.secret
      TZ: Asia/Shanghai
    ports:
      - "${SERVER_PORT:-8089}:8089"
    volumes:
      # Provider 密钥由 Spring 加密；持久化本地主密钥以保证容器重建后仍可解密。
      - server-ai-secret:/root/.car-dealer-crm
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    container_name: car-dealer-crm-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/dealer-web.Dockerfile
      args:
        DOCKERHUB_LIBRARY_PREFIX: ${DOCKERHUB_LIBRARY_PREFIX:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  mysql-data:
  redis-data:
  server-ai-secret:
