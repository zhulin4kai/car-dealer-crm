name: car-dealer-crm-demo

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: car-dealer-crm-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-car_dealer_crm}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init/01-load-demo.sh:/docker-entrypoint-initdb.d/01-load-demo.sh:ro
      - ./dealer-server/src/main/resources/CarDealerCRM.sql:/docker-entrypoint-demo/CarDealerCRM.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: car-dealer-crm-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  server:
    container_name: car-dealer-crm-server
    build:
      context: .
      dockerfile: docker/dealer-server.Dockerfile
      args:
        DOCKERHUB_LIBRARY_PREFIX: ${DOCKERHUB_LIBRARY_PREFIX:-}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-car_dealer_crm}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-car-dealer-crm-local-secret}
      TZ: Asia/Shanghai
    ports:
      - "${SERVER_PORT:-8089}:8089"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    container_name: car-dealer-crm-web
    build:
      context: .
      dockerfile: docker/dealer-web.Dockerfile
      args:
        DOCKERHUB_LIBRARY_PREFIX: ${DOCKERHUB_LIBRARY_PREFIX:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  mysql-data:
  redis-data:
